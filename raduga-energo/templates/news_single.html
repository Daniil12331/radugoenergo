{% extends "base.html" %}

{% block content %}
<section class="section" style="padding-top: 120px;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="reveal">
                    <a href="{{ url_for('news') }}" style="
                        display: inline-flex;
                        align-items: center;
                        gap: 8px;
                        color: var(--text-muted);
                        text-decoration: none;
                        font-size: 0.9rem;
                        font-weight: 600;
                        margin-bottom: 24px;
                        transition: color 0.3s ease;
                    ">
                        <i class="fas fa-arrow-left"></i>
                        Назад к новостям
                    </a>
                </div>

                <div class="reveal reveal-delay-1">
                    <div style="
                        display: inline-block;
                        padding: 4px 14px;
                        border-radius: 100px;
                        background: rgba(13,110,253,0.1);
                        border: 1px solid rgba(13,110,253,0.15);
                        font-size: 0.8rem;
                        font-weight: 600;
                        color: var(--accent);
                        margin-bottom: 16px;
                    ">
                        <i class="far fa-calendar-alt me-1"></i> {{ news.created_at.strftime('%d.%m.%Y') }}
                    </div>

                    <h1 style="
                        font-size: clamp(1.8rem, 3vw, 2.5rem);
                        font-weight: 800;
                        color: #fff;
                        letter-spacing: -0.5px;
                        line-height: 1.15;
                        margin-bottom: 24px;
                    ">{{ news.title }}</h1>

                    <div style="
                        background: var(--glass-bg);
                        border: 1px solid var(--glass-border);
                        border-radius: 24px;
                        padding: 40px 36px;
                        backdrop-filter: blur(20px);
                        line-height: 1.9;
                        color: var(--text);
                        font-size: 1rem;
                    ">
                        <p>{{ news.content }}</p>

                        {% if not news.image %}
                        <div style="
                            margin-top: 30px;
                            padding: 20px 24px;
                            border-radius: 16px;
                            background: rgba(13,110,253,0.04);
                            border: 1px solid rgba(13,110,253,0.08);
                            display: flex;
                            align-items: center;
                            gap: 16px;
                        ">
                            <div style="
                                width: 48px;
                                height: 48px;
                                border-radius: 12px;
                                display: flex;
                                align-items: center;
                                justify-content: center;
                                background: rgba(13,110,253,0.1);
                                color: var(--accent);
                                font-size: 1.2rem;
                                flex-shrink: 0;
                            ">
                                <i class="fas fa-info-circle"></i>
                            </div>
                            <div>
                                <div style="font-size: 0.85rem; font-weight: 600; color: #fff; margin-bottom: 2px;">Радуга Энерго</div>
                                <div style="font-size: 0.8rem; color: var(--text-muted);">Надёжное водоснабжение для вашего дома</div>
                            </div>
                        </div>
                        {% endif %}
                    </div>

                    <div style="text-align: center; margin-top: 40px;" class="reveal reveal-delay-2">
                        <a href="{{ url_for('news') }}" class="btn-custom-outline">
                            <i class="fas fa-arrow-left"></i>
                            Все новости
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('revealed');
            }
        });
    }, { threshold: 0.1 });
    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
});
</script>
{% endblock %}
